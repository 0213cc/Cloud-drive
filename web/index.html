<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Drive</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cloud Drive</h1>
            <div id="user-info">
                <span id="username-display"></span>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </header>

        <main id="file-manager">
            <div class="toolbar">
                <label for="file-upload-input" class="btn">Upload File</label>
                <input type="file" id="file-upload-input" hidden>
                <button id="create-folder-btn" class="btn btn-secondary">Create Folder</button>
            </div>

            <div id="file-list-container">
                <div id="loading-spinner" class="spinner"></div>
                <table id="file-list">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Size</th>
                            <th>Last Modified</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="file-list-body">
                        <!-- File items will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>

            <div id="upload-progress-container" style="display: none;">
                <p>Uploading: <span id="upload-filename"></span></p>
                <div class="progress-bar">
                    <div id="progress-bar-fill"></div>
                </div>
            </div>

            <div id="message-box" class="message-box"></div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
